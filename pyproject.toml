[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vietais-sentinel"
version = "0.1.0a0"
description = "Open-source AI engine foundation for explainable exam proctoring."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "VietAIS contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/NukeGeng/VietAIS-Sentinel"
Issues = "https://github.com/NukeGeng/VietAIS-Sentinel/issues"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx2>=2.13,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vietais_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
